  <polyline points="95,12 105,75 75,110 25,150" fill="none" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="105,75 160,115" fill="none" stroke="#1e293b" stroke-width="2"/>
  <polygon points="40,25 95,12 105,75 38,70" fill="#cbd5e1" fill-opacity="0.3"/>
